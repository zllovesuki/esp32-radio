[package]
name = "str0m-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
str0m = { version = "=0.23.1", default-features = false }
str0m-rust-crypto = { version = "=0.6.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[patch.crates-io]
str0m-rust-crypto = { path = "vendor/str0m-rust-crypto" }

[profile.release]
opt-level = "s"
debug = 1
panic = "abort"
