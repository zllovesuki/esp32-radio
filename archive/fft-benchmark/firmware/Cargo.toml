[workspace]
members = ["crates/radio-core", "crates/esp32-radio"]
default-members = ["crates/radio-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
radio-core = { path = "crates/radio-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
crc32fast = "=1.5.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = "s"
debug = 2
panic = "abort"

[profile.dev]
panic = "abort"
